<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>CineSpotle — Guess the Mystery Movie</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">


  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Outfit', 'Inter', 'sans-serif'],
          },
          colors: {
            cinema: {
              bg: '#0b0f19',
              card: '#131929',
              tile: '#1b2338',
              tileHover: '#232d47',
              border: '#26314d',
              green: '#16a34a',
              greenDark: '#15803d',
              gold: '#d97706',
              goldLight: '#f59e0b',
              accent: '#ec4899'
            }
          }
        }
      }
    };
  </script>


  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #131929;
      --bg-tile: #1b2338;
      --border-subtle: #26314d;
    }


    body {
      background-color: var(--bg-main);
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      background-image:
        radial-gradient(ellipse 80% 35% at 50% 0%, rgba(236, 72, 153, 0.09), transparent),
        radial-gradient(ellipse 60% 30% at 50% 10%, rgba(59, 130, 246, 0.07), transparent);
      min-height: 100vh;
      transition: background-image 0.3s ease;
    }


    body.theme-spotle {
      background-image:
        radial-gradient(ellipse 85% 40% at 50% 0%, rgba(37, 99, 235, 0.12), transparent),
        radial-gradient(ellipse 60% 30% at 50% 12%, rgba(14, 165, 233, 0.06), transparent);
    }


    /* Glowing Cinema Marquee Bulb Strip (inspired by KaunsiFilm) */
    .marquee-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: linear-gradient(180deg, #171024 0%, #0b0f19 100%);
      border-bottom: 1px solid rgba(244, 114, 182, 0.18);
      overflow: hidden;
    }


    .marquee-bulb {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      flex-shrink: 0;
      animation: bulbPulse 2.4s infinite ease-in-out;
    }


    .marquee-bulb:nth-child(odd) {
      background-color: #fbbf24;
      box-shadow: 0 0 8px #f59e0b, 0 0 14px rgba(245, 158, 11, 0.5);
      animation-delay: 0s;
    }


    .marquee-bulb:nth-child(even) {
      background-color: #f472b6;
      box-shadow: 0 0 8px #ec4899, 0 0 14px rgba(236, 72, 153, 0.5);
      animation-delay: 1.2s;
    }


    @keyframes bulbPulse {
      0%, 100% { opacity: 0.45; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }


    /* Staggered 3D Tile Flip Animation */
    @keyframes tileFlipIn {
      0% {
        opacity: 0;
        transform: perspective(600px) rotateX(-75deg) scale(0.94);
      }
      60% {
        opacity: 1;
        transform: perspective(600px) rotateX(10deg) scale(1.01);
      }
      100% {
        opacity: 1;
        transform: perspective(600px) rotateX(0deg) scale(1);
      }
    }


    .animate-tile-flip {
      opacity: 0;
      animation: tileFlipIn 0.52s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }


    /* Card Entrance */
    @keyframes slideDownFade {
      from { opacity: 0; transform: translateY(-14px); }
      to { opacity: 1; transform: translateY(0); }
    }


    .animate-card-enter {
      animation: slideDownFade 0.35s ease-out forwards;
    }


    /* Hide scrollbar for horizontal pill bar while preserving scroll */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }


    /* Custom thin scrollbar for dropdowns & modals */
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #0f1524;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #2b3757;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="antialiased selection:bg-pink-500/30 selection:text-pink-200">


  <!-- Top Glowing Cinema Marquee Bulb Strip -->
  <div id="marqueeStrip" class="marquee-strip" aria-hidden="true"></div>


  <!-- Main App Wrapper -->
  <div class="max-w-2xl mx-auto px-3 sm:px-4 pb-16">


    <!-- Top Navigation Bar (Left: Drawer + Mode | Center: Brand Logo | Right: Controls) -->
    <header class="pt-3 pb-2 grid grid-cols-3 items-center gap-2">
      <!-- Left: Industry Drawer Menu + Daily/Endless Mode Switcher -->
      <div class="flex items-center gap-1.5 sm:gap-2 justify-start">
        <button onclick="openIndustryDrawer()" title="Browse Industries & Database" aria-label="Open Industry Menu" class="w-9 h-9 rounded-full bg-[#131929] hover:bg-[#1b2338] border border-[#26314d] flex items-center justify-center text-slate-300 hover:text-white transition shrink-0">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="17" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>


        <div class="bg-[#131929] border border-[#26314d] rounded-full p-0.5 flex items-center text-[11px] sm:text-xs font-semibold">
          <button id="modeDailyBtn" onclick="setGameMode('daily')" class="px-2 sm:px-2.5 py-1 rounded-full transition-all bg-gradient-to-r from-pink-600 to-amber-600 text-white shadow">
            Daily
          </button>
          <button id="modeEndlessBtn" onclick="setGameMode('endless')" class="px-2 sm:px-2.5 py-1 rounded-full transition-all text-slate-400 hover:text-white">
            Endless
          </button>
        </div>
      </div>


      <!-- Center: Brand Logo "CineSpotle" with Clapperboard / Film-Reel Icon -->
      <div class="flex flex-col items-center justify-center text-center">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-br from-pink-500 via-amber-500 to-emerald-500 p-[1.5px] shadow-lg shadow-pink-500/15 shrink-0">
            <div class="w-full h-full bg-[#131929] rounded-[10px] flex items-center justify-center">
              <!-- Clapperboard + Film Reel SVG Icon -->
              <svg class="w-5 h-5 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 11v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8H4z" />
                <path d="m4 11-.88-2.87a2 2 0 0 1 1.33-2.5l11.48-3.5a2 2 0 0 1 2.5 1.32l.87 2.87L4 11z" />
                <path d="m6.6 4.99 3.38 4.2" />
                <path d="m11.86 3.38 3.38 4.2" />
                <polygon points="10 14 14.5 16.2 10 18.4 10 14" fill="currentColor" stroke="none" />
              </svg>
            </div>
          </div>
          <div class="text-left">
            <div class="flex items-center gap-1">
              <h1 class="font-display font-extrabold text-base sm:text-xl tracking-tight bg-gradient-to-r from-white via-slate-100 to-amber-200 bg-clip-text text-transparent">
                CineSpotle
              </h1>
              <span id="tmdbActiveBadge" class="hidden text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                TMDB
              </span>
            </div>
          </div>
        </div>
      </div>


      <!-- Right: Sound Toggle, How to Play (?), Settings Gear, Stats/Profile -->
      <div class="flex items-center gap-1 sm:gap-1.5 justify-end">
        <!-- Sound Toggle -->
        <button id="soundToggleBtn" onclick="toggleSound()" title="Toggle Sound Effects" aria-label="Toggle Sound" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-[#131929] hover:bg-[#1b2338] border border-[#26314d] flex items-center justify-center text-slate-300 transition">
          <svg id="soundOnIcon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="soundOffIcon" class="w-4 h-4 hidden text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>


        <!-- How to Play (?) Button -->
        <button onclick="openHowToPlayModal()" title="How to Play" aria-label="How to Play" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-[#131929] hover:bg-[#1b2338] border border-[#26314d] flex items-center justify-center text-slate-300 hover:text-white font-bold text-xs sm:text-sm transition">
          ?
        </button>


        <!-- Settings Gear Button -->
        <button onclick="openSettingsModal()" title="Settings, Theme & TMDB API" aria-label="Settings" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-[#131929] hover:bg-[#1b2338] border border-[#26314d] flex items-center justify-center text-slate-300 transition">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>


        <!-- Stats / Profile Button -->
        <button onclick="openStatsModal()" title="Statistics & Streak" aria-label="Statistics" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-[#131929] hover:bg-[#1b2338] border border-[#26314d] flex items-center justify-center text-slate-300 transition">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>
      </div>
    </header>


    <!-- Industry Filter Pills + Endless "New Movie" Action -->
    <nav aria-label="Cinema Industry Filter" class="py-2 flex items-center justify-between gap-2">
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
        <button data-industry="All Cinema" onclick="setIndustryFilter('All Cinema')" class="industry-pill whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-semibold border transition-all bg-white text-[#0b0f19] border-white shadow-sm">
          All
        </button>
        <button data-industry="Hollywood" onclick="setIndustryFilter('Hollywood')" class="industry-pill whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-semibold border transition-all bg-[#131929] text-slate-300 border-[#26314d] hover:border-slate-500">
          Hollywood
        </button>
        <button data-industry="Bollywood" onclick="setIndustryFilter('Bollywood')" class="industry-pill whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-semibold border transition-all bg-[#131929] text-slate-300 border-[#26314d] hover:border-slate-500">
          Bollywood
        </button>
        <button data-industry="Kannada" onclick="setIndustryFilter('Kannada')" class="industry-pill whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-semibold border transition-all bg-[#131929] text-slate-300 border-[#26314d] hover:border-slate-500">
          Kannada
        </button>
        <button data-industry="Pan-India" onclick="setIndustryFilter('Pan-India')" class="industry-pill whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-semibold border transition-all bg-[#131929] text-slate-300 border-[#26314d] hover:border-slate-500">
          Pan-India
        </button>
      </div>


      <!-- Endless Mode "New Movie" Quick Shuffle Button -->
      <button id="endlessNewMovieBtn" onclick="initRound()" title="Load a new random movie" class="hidden shrink-0 px-3 py-1.5 rounded-full bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/40 text-amber-300 text-xs font-bold flex items-center gap-1 transition active:scale-95">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        <span>New Movie</span>
      </button>
    </nav>


    <!-- Sub-Header Control Bar: Hint | Guess X of 10 | Give up -->
    <div class="mt-2 mb-3 flex items-center justify-between gap-2">
      <!-- Hint Button -->
      <button id="hintBtn" onclick="unlockNextHint()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-[#131929] hover:bg-[#1b2338] border border-[#26314d] text-xs font-semibold text-amber-300 transition active:scale-95 disabled:opacity-45 disabled:cursor-not-allowed">
        <svg class="w-3.5 h-3.5 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"></path>
        </svg>
        <span id="hintBtnLabel">Hint (3)</span>
      </button>


      <!-- Live Guess Counter -->
      <div class="text-sm font-semibold text-slate-300 tracking-wide">
        Guess <span id="currentGuessDisplay" class="text-pink-400 font-extrabold">1</span> of <span class="text-slate-400">10</span>
      </div>


      <!-- Give Up Button -->
      <button id="giveUpBtn" onclick="promptGiveUp()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-[#131929] hover:bg-rose-950/50 border border-[#26314d] hover:border-rose-500/40 text-xs font-semibold text-slate-200 hover:text-rose-300 transition active:scale-95 disabled:opacity-45 disabled:cursor-not-allowed">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
          <line x1="4" y1="22" x2="4" y2="15"></line>
        </svg>
        <span>Give up</span>
      </button>
    </div>


    <!-- Inline Give Up Confirmation Banner (replaces confirm()) -->
    <div id="giveUpConfirmBanner" class="hidden mb-3 p-3 rounded-2xl bg-rose-950/60 border border-rose-500/40 flex items-center justify-between gap-3 animate-card-enter">
      <p class="text-xs sm:text-sm text-rose-100 font-medium">Reveal the mystery movie and end this round?</p>
      <div class="flex items-center gap-2 shrink-0">
        <button onclick="cancelGiveUp()" class="px-3 py-1.5 rounded-lg bg-[#131929] text-slate-300 text-xs font-semibold hover:bg-[#1b2338]">Cancel</button>
        <button onclick="confirmGiveUp()" class="px-3 py-1.5 rounded-lg bg-rose-600 text-white text-xs font-semibold hover:bg-rose-500">Reveal</button>
      </div>
    </div>


    <!-- Unlocked Hints Drawer -->

      <div class="flex items-center justify-between">

          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>
          Unlocked Clues
        </span>

      </div>
      <div id="hintsList" class="space-y-1.5 text-xs text-slate-200"></div>
    </div>


    <!-- Search Bar + Autocomplete Dropdown -->
    <div class="relative mb-4 z-30">
      <div class="relative flex items-center">
        <input
          id="movieSearchInput"
          type="text"
          autocomplete="off"
          placeholder="Search for a movie or film..."
          class="w-full pl-4 pr-11 py-3.5 rounded-2xl bg-[#131929] border-2 border-[#26314d] focus:border-pink-500/80 focus:ring-4 focus:ring-pink-500/10 focus:outline-none text-sm sm:text-base text-white placeholder-slate-400 shadow-lg transition-all"
        />
        <div id="searchIconWrap" class="absolute right-3.5 text-slate-400 pointer-events-none">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <!-- Clear Search Button -->
        <button id="clearSearchBtn" onclick="clearSearchInput()" class="hidden absolute right-3.5 text-slate-400 hover:text-white p-1" aria-label="Clear search">

            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>


      <!-- Instant Autocomplete Dropdown -->
      <div id="searchDropdown" class="hidden absolute left-0 right-0 mt-2 rounded-2xl bg-[#131929] border border-[#2d3a5c] shadow-2xl shadow-black/80 max-h-80 overflow-y-auto custom-scroll divide-y divide-[#1f2942]">
      </div>
    </div>


    <!-- Post-Game Banner (Shown when round is over so user can re-open summary or start next game) -->
    <div id="roundCompleteBanner" class="hidden mb-4 p-4 rounded-2xl bg-gradient-to-r from-[#131929] via-[#192238] to-[#131929] border border-emerald-500/40 flex flex-col sm:flex-row items-center justify-between gap-3 animate-card-enter">
      <div>
        <p id="roundBannerTitle" class="font-display font-bold text-base text-white">Mystery Movie Solved!</p>
        <p id="roundBannerSubtitle" class="text-xs text-slate-300">You found the film in 3 guesses.</p>
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <button onclick="openEndModal()" class="flex-1 sm:flex-initial px-3.5 py-2 rounded-xl bg-[#1b2338] hover:bg-[#25304d] border border-[#2d3b5e] text-xs font-semibold text-white transition">
          View Summary
        </button>
        <button onclick="startNextMovie()" class="flex-1 sm:flex-initial px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white shadow-lg shadow-emerald-600/20 transition">
          Next Movie →
        </button>
      </div>
    </div>


    <!-- Empty State Prompt (Shown before first guess) -->
    <div id="emptyStateCard" class="mb-4 p-6 rounded-2xl bg-[#131929]/90 border border-[#26314d] text-center space-y-3">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-[#1b2338] border border-[#2a3654] flex items-center justify-center text-amber-400">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19.82 2H4.18C2.97 2 2 2.97 2 4.18v15.64C2 21.03 2.97 22 4.18 22h15.64c1
